name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-22.04
            label: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # qt_generate_deploy_qml_app_script bundles Qt + the QML module on
      # Windows and macOS; Linux is handled by linuxdeploy below.
      - name: Package (Windows/macOS)
        if: matrix.label != 'linux'
        run: cmake --install build --prefix dist

      - name: Make a dmg
        if: matrix.label == 'macos'
        run: |
          hdiutil create -volname "Super Infinity" -srcfolder dist/SuperInfinity.app \
            -ov -format UDZO SuperInfinity-macos.dmg

      - name: Zip the Windows build
        if: matrix.label == 'windows'
        run: Compress-Archive -Path dist/* -DestinationPath SuperInfinity-windows.zip
        shell: pwsh

      - name: Build an AppImage
        if: matrix.label == 'linux'
        run: |
          cmake --install build --prefix AppDir/usr
          cat > AppDir/usr/share/applications/super-infinity.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Super Infinity
          Exec=SuperInfinity
          Icon=super-infinity
          Categories=AudioVideo;
          EOF
          # linuxdeploy wants an icon; a flat placeholder keeps the build green.
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert -size 256x256 xc:'#6C5CE7' \
            AppDir/usr/share/icons/hicolor/256x256/apps/super-infinity.png || \
            touch AppDir/usr/share/icons/hicolor/256x256/apps/super-infinity.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS=$PWD/qml
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv Super_Infinity*.AppImage SuperInfinity-linux.AppImage 2>/dev/null || \
            mv ./*.AppImage SuperInfinity-linux.AppImage
        env:
          OUTPUT: SuperInfinity-linux.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperInfinity-${{ matrix.label }}
          path: |
            SuperInfinity-windows.zip
            SuperInfinity-macos.dmg
            SuperInfinity-linux.AppImage
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
