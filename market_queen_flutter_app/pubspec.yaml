name: market_queen
description: "Market Queen - a free, open-source desktop app that generates UGC video ads. Bring your own API keys."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State. One ChangeNotifier per former QObject; the widget tree listens.
  provider: ^6.1.2

  # Networking. `http` gives us multipart for free, which several providers need.
  http: ^1.2.2

  # MediaType, for the content type every multipart part has to declare. `http`
  # defaults them to application/octet-stream, which the OpenAI uploads reject.
  http_parser: ^4.0.2

  # SHA-256 + HMAC, so secrets.bin keeps the exact format the Qt build wrote.
  crypto: ^3.0.5

  # JPEG re-encoding for the data: URIs, and the centre-crop Sora insists on.
  image: ^4.3.0

  mime: ^2.0.0
  path: ^1.9.0
  intl: ^0.20.2

  # Desktop plumbing: native file/folder dialogs, drag-and-drop, window sizing.
  file_selector: ^1.0.3
  desktop_drop: ^0.5.0
  window_manager: ^0.4.3
  url_launcher: ^6.3.1

  # Audition playback and the finished-ad preview. media_kit is the one player
  # with real Windows support.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Reused verbatim from the Qt build: the price catalogue, the casting
    # scaffold and the translation maps are data, not code.
    - assets/resources/
    - assets/i18n/
    # The app's own mark. Declared as a directory so dropping logo.png in is the
    # whole install step -- see assets/brand/README.md. The folder is allowed to
    # hold nothing but that README: BrandMark falls back to a drawn tile.
    - assets/brand/
    # The providers' marks, on the same terms and for the same reason: named
    # after the credential id, picked up at run time, initials drawn until one
    # is dropped in. Ships empty -- see assets/brand/providers/README.md.
    - assets/brand/providers/

  # Inter, shipped rather than fetched: an app that promises nothing leaves the
  # machine cannot pull a webfont at startup, and a bundled face renders the
  # same on every desktop instead of following whatever Segoe the OS carries.
  # Three weights is the whole ladder the interface uses -- see MqTheme.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
